name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  rust-test:
    name: Rust Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: nix develop .#rust --command bash -e {0}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31.11.2
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Cache cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: extractor

      - name: Check formatting
        run: cargo fmt --check
        working-directory: extractor

      - name: Clippy
        run: cargo clippy -- -D warnings
        working-directory: extractor

      - name: Build
        run: cargo build --release
        working-directory: extractor

      - name: Test
        run: cargo test
        working-directory: extractor

  msrv:
    name: MSRV Check (Rust 1.82)
    runs-on: ubuntu-latest
    # Not via nix: the dev shell tracks nixpkgs' rustc, this pins the floor.
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: dtolnay/rust-toolchain@40a9285135951116a4a08e10a723a42b12d721d3 # 1.82.0
        with:
          toolchain: 1.82.0
      - run: cargo build
        working-directory: extractor
