name: Security

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 0 * * 0'

jobs:
  sbom:
    name: Generate SBOM
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: nix develop .#rust --command bash -e {0}
    steps:
      - uses: actions/checkout@v6

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Generate SBOM
        # Without --override-filename it writes <crate-name>.cdx.json.
        run: cargo cyclonedx --format json --override-filename bom
        working-directory: extractor

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: extractor/bom.json
          if-no-files-found: error
